
name: PayLink CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore PayLink.sln

      - name: Check code formatting
        run: dotnet format PayLink.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build PayLink.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PayLink.sln --configuration Release --no-build
